<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src https: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>OpenGen Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070a;--s1:#0d0f14;--s2:#13151c;--s3:#1a1d26;--bd:#1f2230;--bd2:#2a2e40;--tx:#e8ecf4;--tx2:#7a8099;--tx3:#3d4258;--accent:#22d3ee;--v:#a78bfa;--p:#f472b6;--o:#fb923c;--g:#34d399;--y:#fbbf24;--b:#60a5fa;--r:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(34,211,238,.06),transparent),radial-gradient(ellipse 40% 40% at 90% 80%,rgba(167,139,250,.04),transparent);pointer-events:none;z-index:0;}

/* TOPBAR */
#topbar{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--bd);position:relative;z-index:50;flex-shrink:0;gap:8px;background:rgba(6,7,10,.95);backdrop-filter:blur(20px);}
#logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#logo-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;background:linear-gradient(135deg,var(--accent),#6366f1);transition:background .3s;}
#logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.5px;}
#logo-text span{color:var(--accent);transition:color .3s;}
#logo-badge{font-size:9px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:4px;padding:2px 6px;color:var(--tx3);font-family:'DM Mono',monospace;letter-spacing:.5px;}
#section-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
#section-tabs::-webkit-scrollbar{display:none;}
.sec-tab{background:none;border:1px solid transparent;color:var(--tx3);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;letter-spacing:.2px;}
.sec-tab:hover{color:var(--tx2);border-color:var(--bd2);}
.sec-tab.active{border-color:var(--a,var(--accent));color:var(--a,var(--accent));background:color-mix(in srgb,var(--a,var(--accent)) 10%,transparent);}
#topbar-right{display:flex;gap:6px;flex-shrink:0;}
.top-btn{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:7px;color:var(--tx2);font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 10px;cursor:pointer;transition:all .15s;}
.top-btn:hover{border-color:var(--bd2);color:var(--tx);}
.top-btn.key-ok{border-color:rgba(34,211,238,.3);color:var(--accent);background:rgba(34,211,238,.06);}
.top-btn.key-err{border-color:rgba(248,113,113,.3);color:var(--r);background:rgba(248,113,113,.06);}
.top-btn.hist-on{border-color:var(--bd2);color:var(--tx);}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;position:relative;z-index:1;}

/* LEFT PANEL */
#left{width:268px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:rgba(13,15,20,.6);}
#left-scroll{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:13px;}
#left-scroll::-webkit-scrollbar{width:3px;}
#left-scroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
.sec-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.left-footer{padding:12px;flex-shrink:0;border-top:1px solid var(--bd);}

/* upload zone */
#upload-zone{border:1.5px dashed var(--bd2);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;}
#upload-zone:hover,#upload-zone.drag{border-color:var(--a,var(--accent));background:color-mix(in srgb,var(--a,var(--accent)) 5%,transparent);}
#upload-preview{position:relative;border-radius:10px;overflow:hidden;}
#upload-preview img{width:100%;max-height:130px;object-fit:cover;display:block;border-radius:10px;}
#upload-clear{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.75);border:none;border-radius:5px;color:#fff;width:22px;height:22px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}

/* textarea */
.prompt-wrap{position:relative;}
.prompt-ta{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:13px;font-family:'DM Sans',sans-serif;resize:none;outline:none;padding:11px 13px;transition:border-color .2s;min-height:82px;}
.prompt-ta:focus{border-color:var(--a,var(--accent));}
.prompt-hint{font-size:10px;color:var(--tx3);margin-top:4px;display:flex;justify-content:space-between;}
.example-btn{background:none;border:none;color:var(--a,var(--accent));cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;}

/* params */
.param-row{display:flex;gap:10px;}
.param-group{flex:1;}
.param-group-label{font-size:9px;color:var(--tx3);margin-bottom:5px;font-family:'DM Mono',monospace;letter-spacing:.5px;}
.pill-row{display:flex;flex-wrap:wrap;gap:4px;}
.pill{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:5px;padding:4px 9px;cursor:pointer;font-size:10px;color:var(--tx3);transition:all .12s;font-family:'DM Mono',monospace;}
.pill:hover{color:var(--tx2);border-color:var(--bd2);}
.pill.on{color:var(--a,var(--accent));border-color:color-mix(in srgb,var(--a,var(--accent)) 50%,transparent);background:color-mix(in srgb,var(--a,var(--accent)) 10%,transparent);}

/* gen button */
#gen-btn{width:100%;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;padding:12px;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;letter-spacing:.3px;position:relative;overflow:hidden;}
#gen-btn:not(:disabled):hover{transform:translateY(-1px);filter:brightness(1.1);}
#gen-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
#gen-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08),transparent 70%);transform:translateX(-100%);transition:transform .5s;}
#gen-btn:not(:disabled):hover::after{transform:translateX(100%);}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* model strip */
#model-strip-wrap{border-bottom:1px solid var(--bd);padding:10px 14px;flex-shrink:0;background:rgba(13,15,20,.4);}
#model-strip-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#model-count{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);}
#model-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;}
#model-strip::-webkit-scrollbar{height:2px;}
#model-strip::-webkit-scrollbar-thumb{background:var(--bd2);}
.model-chip{flex-shrink:0;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;cursor:pointer;transition:all .12s;}
.model-chip:hover{border-color:var(--bd2);}
.model-chip.selected{background:color-mix(in srgb,var(--a,var(--accent)) 10%,transparent);border-color:var(--a,var(--accent));}
.chip-name{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:3px;white-space:nowrap;}
.model-chip.selected .chip-name{color:var(--a,var(--accent));}
.chip-meta{display:flex;align-items:center;gap:4px;}
.chip-badge{border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700;font-family:'DM Mono',monospace;}
.chip-desc{font-size:10px;color:var(--tx3);white-space:nowrap;}

/* result */
#result-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;}
#result-area::-webkit-scrollbar{width:3px;}
#result-area::-webkit-scrollbar-thumb{background:var(--bd2);}

#progress-bar-wrap{height:2px;background:var(--bd);border-radius:1px;overflow:hidden;margin-bottom:12px;flex-shrink:0;}
#progress-bar{height:100%;width:0%;border-radius:1px;transition:width .6s ease;}

.result-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10;opacity:.2;}
.result-empty-icon{font-size:60px;}
.result-empty-text{font-size:13px;color:var(--tx3);}

.result-media{display:flex;flex-direction:column;gap:9px;animation:fadeUp .35s ease;flex:1;}
.result-media img,.result-media video{width:100%;max-height:460px;object-fit:contain;border-radius:12px;background:#000;}
.result-audio-wrap{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;}
.result-dl{display:block;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:8px;color:var(--tx2);padding:8px;font-size:12px;text-decoration:none;transition:all .15s;}
.result-dl:hover{border-color:var(--bd2);color:var(--tx);}
.result-error{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;text-align:center;}

.spinner{width:52px;height:52px;border:3px solid rgba(255,255,255,.05);border-top-color:var(--a,var(--accent));border-radius:50%;animation:spin .9s linear infinite;}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;}
.loading-pct{font-family:'DM Mono',monospace;font-size:12px;color:var(--tx3);}
.loading-hint{font-size:11px;color:var(--tx3);}
.loading-bar-wrap{width:180px;height:2px;background:var(--bd);border-radius:1px;overflow:hidden;}
.loading-bar{height:100%;border-radius:1px;transition:width .6s ease;}

/* RIGHT HISTORY */
#hist-panel{width:190px;flex-shrink:0;border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:rgba(13,15,20,.4);}
#hist-head{padding:11px 11px 8px;border-bottom:1px solid var(--bd);font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;flex-shrink:0;}
#hist-list{flex:1;overflow-y:auto;padding:8px;}
#hist-list::-webkit-scrollbar{width:3px;}
#hist-list::-webkit-scrollbar-thumb{background:var(--bd2);}
.hist-item{cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid var(--bd);margin-bottom:7px;aspect-ratio:16/9;position:relative;background:var(--s2);transition:border-color .15s;}
.hist-item:hover{border-color:var(--bd2);}
.hist-item.selected{border-color:var(--a,var(--accent));}
.hist-item img{width:100%;height:100%;object-fit:cover;display:block;}
.hist-item-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.hist-item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:6px 5px 3px;font-size:9px;color:rgba(255,255,255,.5);font-family:'DM Mono',monospace;}
.hist-empty{font-size:11px;color:var(--tx3);text-align:center;padding:20px 0;}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(12px);}
#modal-overlay.hidden{display:none;}
#modal{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;width:380px;padding:26px;animation:fadeUp .2s ease;}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;margin-bottom:6px;}
.modal-sub{color:var(--tx2);font-size:13px;margin-bottom:20px;line-height:1.5;}
.modal-sub a{color:var(--accent);}
.modal-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd2);border-radius:9px;color:var(--tx);font-size:13px;padding:11px 13px;outline:none;font-family:'DM Mono',monospace;transition:border-color .2s;margin-bottom:14px;}
.modal-input:focus{border-color:rgba(34,211,238,.4);}
.modal-btns{display:flex;gap:8px;}
.modal-btn{flex:1;border-radius:9px;padding:11px;cursor:pointer;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s;border:1px solid var(--bd);}
.modal-btn.cancel{background:rgba(255,255,255,.04);color:var(--tx2);}
.modal-btn.confirm{background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;border-color:transparent;}
.modal-btn.confirm:disabled{opacity:.4;cursor:not-allowed;}
.modal-btn-del{width:100%;margin-top:9px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.2);border-radius:9px;color:var(--r);padding:9px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .15s;}

/* ANIM */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div id="logo">
    <div id="logo-icon">✦</div>
    <div id="logo-text">Open<span>Gen</span></div>
    <div id="logo-badge">STUDIO</div>
  </div>
  <div id="section-tabs">
    <button class="sec-tab active" data-sec="t2i"   style="--a:var(--accent)">✦ Text → Image</button>
    <button class="sec-tab"        data-sec="edit"  style="--a:var(--v)">✏ Edit Image</button>
    <button class="sec-tab"        data-sec="i2v"   style="--a:var(--p)">▶ Image → Video</button>
    <button class="sec-tab"        data-sec="t2v"   style="--a:var(--o)">🎬 Text → Video</button>
    <button class="sec-tab"        data-sec="vfx"   style="--a:var(--g)">✨ VFX</button>
    <button class="sec-tab"        data-sec="audio" style="--a:var(--y)">♪ Audio</button>
    <button class="sec-tab"        data-sec="upscale" style="--a:var(--b)">⬆ Upscale</button>
  </div>
  <div id="topbar-right">
    <button class="top-btn" id="hist-toggle-btn" onclick="toggleHistory()">◷ <span id="hist-count">0</span></button>
    <button class="top-btn key-err" id="key-btn" type="button" disabled>🔒 Esperando dashboard</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT -->
  <div id="left">
    <div id="left-scroll">

      <!-- Upload zone (shown for edit/i2v/vfx/upscale) -->
      <div id="upload-section" style="display:none">
        <div class="sec-label">Imagen de entrada</div>
        <div id="upload-zone" onclick="document.getElementById('file-input').click()"
             ondragover="event.preventDefault();this.classList.add('drag')"
             ondragleave="this.classList.remove('drag')"
             ondrop="handleDrop(event)">
          <div style="font-size:22px;opacity:.35;margin-bottom:6px">📁</div>
          <div style="font-size:12px;color:var(--tx3)">Arrastra o haz clic</div>
          <div style="font-size:10px;color:var(--tx3);margin-top:3px">JPG · PNG · WEBP</div>
        </div>
        <div id="upload-preview" style="display:none">
          <img id="upload-img" src="" alt="">
          <button id="upload-clear" onclick="clearUpload()">✕</button>
        </div>
        <input id="file-input" type="file" accept="image/*" style="display:none" onchange="handleFileInput(event)">
      </div>
      <!-- URL input alternative -->
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <div style="flex:1;height:1px;background:var(--bd)"></div>
        <span style="font-size:9px;color:var(--tx3);font-family:'DM Mono',monospace">O PEGA URL</span>
        <div style="flex:1;height:1px;background:var(--bd)"></div>
      </div>
      <input id="url-input" type="url" placeholder="https://ejemplo.com/imagen.jpg"
        style="width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);font-size:11px;padding:8px 10px;outline:none;margin-top:6px;font-family:'DM Mono',monospace;transition:border-color .2s;"
        oninput="handleUrlInput(this.value)" />

      <!-- Prompt -->
      <div id="prompt-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <div class="sec-label" style="margin-bottom:0">Prompt</div>
          <button class="example-btn" onclick="fillExample()">ejemplo ↗</button>
        </div>
        <div class="prompt-wrap">
          <textarea id="prompt-ta" class="prompt-ta" placeholder="Describe lo que quieres generar..."></textarea>
        </div>
        <div class="prompt-hint">
          <span id="prompt-count">0/3000</span>
          <span>⌘↵ generar</span>
        </div>
      </div>

      <!-- Params -->
      <div id="params-section">
        <div class="sec-label">Parámetros</div>

        <!-- Image ratio (t2i, edit, upscale) -->
        <div id="param-img-ratio">
          <div class="param-group-label">Aspect Ratio</div>
          <div class="pill-row" id="img-ratio-pills"></div>
        </div>

        <!-- Video params -->
        <div id="param-vid" style="display:none">
          <div class="param-row" style="margin-bottom:10px">
            <div class="param-group">
              <div class="param-group-label">Ratio</div>
              <div class="pill-row" id="vid-ratio-pills"></div>
            </div>
            <div class="param-group">
              <div class="param-group-label">Duración</div>
              <div class="pill-row" id="dur-pills"></div>
            </div>
          </div>
          <div class="param-group">
            <div class="param-group-label">Resolución</div>
            <div class="pill-row" id="res-pills"></div>
          </div>
        </div>
      </div>

    </div><!-- /left-scroll -->

    <div class="left-footer">
      <label style="display:flex;gap:7px;align-items:flex-start;font-size:10px;color:var(--tx3);line-height:1.35;margin-bottom:8px;cursor:pointer">
        <input id="rights-confirm" type="checkbox" style="margin-top:2px">
        <span>Confirmo que tengo permiso para usar el material, rostro o voz enviado y que revisaré el resultado antes de publicarlo.</span>
      </label>
      <div id="cost-status" style="font-size:9px;color:var(--tx3);font-family:'DM Mono',monospace;margin-bottom:7px">Cuota segura: esperando dashboard</div>
      <button id="gen-btn" onclick="generating?cancelGeneration():generate()" disabled>✦ Generar</button>
    </div>
  </div><!-- /left -->

  <!-- CENTER -->
  <div id="center">
    <!-- Model strip -->
    <div id="model-strip-wrap">
      <div id="model-strip-head">
        <div class="sec-label" style="margin-bottom:0">Modelo</div>
        <div id="model-count" class="sec-label" style="margin-bottom:0"></div>
      </div>
      <div id="model-strip"></div>
    </div>

    <!-- Result -->
    <div id="result-area">
      <div id="progress-bar-wrap" style="display:none">
        <div id="progress-bar"></div>
      </div>
      <div id="result-content">
        <div class="result-empty" id="empty-state">
          <div class="result-empty-icon" id="empty-icon">✦</div>
          <div class="result-empty-text">El resultado aparecerá aquí</div>
        </div>
      </div>
    </div>
  </div><!-- /center -->

  <!-- HISTORY (hidden by default) -->
  <div id="hist-panel" style="display:none">
    <div id="hist-head">Historial de esta sesión · <span id="hist-count2">0</span></div>
    <div id="hist-list"><div class="hist-empty">Sin historial aún</div></div>
  </div>

</div><!-- /main -->

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const SECTIONS = {
  t2i:    { label:'Text → Image',   icon:'✦', color:'var(--accent)', isVid:false, needImg:false },
  edit:   { label:'Edit Image',     icon:'✏', color:'var(--v)',      isVid:false, needImg:true  },
  i2v:    { label:'Image → Video',  icon:'▶', color:'var(--p)',      isVid:true,  needImg:true  },
  t2v:    { label:'Text → Video',   icon:'🎬',color:'var(--o)',      isVid:true,  needImg:false },
  vfx:    { label:'VFX / Effects',  icon:'✨', color:'var(--g)',      isVid:true,  needImg:true  },
  audio:  { label:'Audio & Music',  icon:'♪', color:'var(--y)',      isVid:false, needImg:false, isAudio:true },
  upscale:{ label:'Upscale',        icon:'⬆', color:'var(--b)',      isVid:false, needImg:true, noPrompt:true },
};

const MODELS = {
  t2i: [
    {id:'flux-schnell',ep:'flux-schnell-image',name:'Flux Schnell',badge:'Fast',bc:'#22d3ee',desc:'Ultra-rápido'},
    {id:'flux-dev',ep:'flux-dev-image',name:'Flux Dev',badge:'HQ',bc:'#60a5fa',desc:'Alta calidad'},
    {id:'flux-kontext-pro-t2i',ep:'flux-kontext-pro',name:'Flux Kontext Pro',badge:'Pro',bc:'#a78bfa',desc:'Contexto avanzado'},

// ─── SECURE HOST BRIDGE / UPLOAD ──────────────────────────────────────────────
const HOST_ORIGIN='https://dashboard.thelab.solutions';
const PROTOCOL_VERSION=1;
const RESULT_HOST_SUFFIXES=['muapi.ai','fal.media','replicate.delivery','cloudfront.net','amazonaws.com'];
const rpcPending=new Map();
let rpcSeq=0,hostReady=false,currentJobController=null;

function postHost(type,payload={}){
  if(window.parent===window)return;
  window.parent.postMessage({source:'opengen',version:PROTOCOL_VERSION,type,...payload},HOST_ORIGIN);
}
function announceReady(){postHost('ready',{app:'OpenGen Studio'});}
function safeHttpsUrl(value,{result=false}={}){
  try{
    const u=new URL(String(value||''));
    if(u.protocol!=='https:'||u.username||u.password)return null;
    const h=u.hostname.toLowerCase();
    if(!h||h==='localhost'||h.endsWith('.local')||/^\d+\.\d+\.\d+\.\d+$/.test(h))return null;
    if(result&&!RESULT_HOST_SUFFIXES.some(x=>h===x||h.endsWith('.'+x)))return null;
    return u.toString();
  }catch(_){return null;}
}
function allowedInputUrl(value){
  const safe=safeHttpsUrl(value);if(!safe)return null;
  return /\.(?:jpe?g|png|webp)$/i.test(new URL(safe).pathname)?safe:null;
}
function hostRpc(action,payload={},signal){
  if(!hostReady||window.parent===window)return Promise.reject(new Error('OpenGen debe abrirse dentro del dashboard autenticado'));
  const requestId='rpc_'+Date.now().toString(36)+'_'+(++rpcSeq).toString(36);
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{rpcPending.delete(requestId);reject(new Error('El dashboard no respondió a tiempo'));},50000);
    const onAbort=()=>{clearTimeout(timer);rpcPending.delete(requestId);const e=new Error('Generación cancelada');e.name='AbortError';reject(e);};
    if(signal){
      if(signal.aborted){onAbort();return;}
      signal.addEventListener('abort',onAbort,{once:true});
    }
    rpcPending.set(requestId,{resolve,reject,timer,signal,onAbort});
    postHost('rpc',{requestId,action,payload});
  });
}
window.addEventListener('message',event=>{
  if(event.origin!==HOST_ORIGIN||event.source!==window.parent)return;
  const msg=event.data;
  if(!msg||msg.source!=='tls-dashboard'||msg.version!==PROTOCOL_VERSION)return;
  if(msg.type==='host-ready'){
    hostReady=true;
    const key=document.getElementById('key-btn');
    if(key){key.textContent='🔒 Backend seguro';key.className='top-btn key-ok';}
    const cap=document.getElementById('cost-status');
    if(cap)cap.textContent='Backend TLS activo · consultando cuota…';
    hostRpc('quota',{}).then(q=>{if(cap)cap.textContent='Cuota diaria segura: '+(q.daily_limit||'—')+' generaciones';}).catch(()=>{});
    updateGenBtn();return;
  }
  if(msg.type==='pause'){currentJobController?.abort();return;}
  if(msg.type!=='rpc-result'||typeof msg.requestId!=='string')return;
  const p=rpcPending.get(msg.requestId);if(!p)return;
  rpcPending.delete(msg.requestId);clearTimeout(p.timer);
  if(p.signal)p.signal.removeEventListener('abort',p.onAbort);
  if(msg.ok)p.resolve(msg.data||{});
  else{
    const e=new Error(msg.data?.error||('Error del backend ('+(msg.status||0)+')'));
    e.status=msg.status||0;e.code=msg.data?.code||'';e.transient=!!msg.data?.transient;p.reject(e);
  }
});
async function uploadImageForAPI(base64DataUrl,signal){
  const compressed=await compressImage(base64DataUrl,1280,0.88);
  const data=await hostRpc('upload',{dataUrl:compressed},signal);
  const url=safeHttpsUrl(data.url,{result:true});
  if(!url)throw new Error('El backend devolvió una URL de imagen no permitida');
  return url;
}

async function compressImage(dataUrl, maxSize = 1024, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function switchSection(sec) {
  if(generating&&sec!==currentSection){setResultError('Cancela la generación actual antes de cambiar de herramienta.');return;}
  currentSection = sec;
  const info = SECTIONS[sec];

  // Update topbar tabs
  document.querySelectorAll('.sec-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.sec-tab[data-sec="${sec}"]`).classList.add('active');

  // Update accent
  document.documentElement.style.setProperty('--a', info.color);
  document.getElementById('logo-icon').style.background = `linear-gradient(135deg, ${info.color}, #6366f1)`;
  document.querySelector('#logo-text span').style.color = info.color.replace('var(','').replace(')','');

  // Upload zone
  document.getElementById('upload-section').style.display = info.needImg ? 'block' : 'none';

  // Prompt section
  document.getElementById('prompt-section').style.display = info.noPrompt ? 'none' : 'block';
  if(!info.noPrompt){
    const ta = document.getElementById('prompt-ta');
    ta.style.setProperty('--a', info.color);
    ta.placeholder = sec === 'audio' ? 'Describe el sonido o música...' : info.needImg ? 'Describe cómo transformar la imagen...' : 'Describe la imagen o video...';
  }

  // Params
  document.getElementById('param-img-ratio').style.display = (!info.isVid && !info.isAudio && !info.noPrompt) ? 'block' : 'none';
  document.getElementById('param-vid').style.display = info.isVid ? 'block' : 'none';

  // Models
  buildModelStrip(sec);

  // Gen btn
  updateGenBtn();
  setResultEmpty();
}

document.querySelectorAll('.sec-tab').forEach(t => {
  t.addEventListener('click', () => switchSection(t.dataset.sec));
});

// ─── MODEL STRIP ─────────────────────────────────────────────────────────────
function buildModelStrip(sec){
  const strip = document.getElementById('model-strip');
  strip.innerHTML = '';
  const models = MODELS[sec] || [];
  document.getElementById('model-count').textContent = `— ${models.length} disponibles`;
  if(!selectedModel[sec]) selectedModel[sec] = models[0]?.id;

  models.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'model-chip' + (m.id===selectedModel[sec]?' selected':'');
    chip.innerHTML = `<div class="chip-name">${m.name}</div><div class="chip-meta"><span class="chip-badge" style="background:${m.bc}18;color:${m.bc};border:1px solid ${m.bc}30">${m.badge}</span><span class="chip-desc">${m.desc}</span></div>`;
    chip.onclick = () => {
      selectedModel[sec] = m.id;
      strip.querySelectorAll('.model-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    };
    strip.appendChild(chip);
  });
}

// ─── PROMPT ──────────────────────────────────────────────────────────────────
function onPromptInput(){
  const v = document.getElementById('prompt-ta').value;
  document.getElementById('prompt-count').textContent = v.length+'/3000';
  updateGenBtn();
}

function fillExample(){

  onPromptInput();

function updateGenBtn(){
  const info=SECTIONS[currentSection];
  const hasPrompt=info.noPrompt||!!document.getElementById('prompt-ta').value.trim();
  const hasImg=!info.needImg||!!uploadedImageUrl;
  const rights=!!document.getElementById('rights-confirm')?.checked;
  const btn=document.getElementById('gen-btn');
  btn.disabled=!generating&&(!hostReady||!hasPrompt||!hasImg||!rights);
  btn.textContent=generating?'■ Cancelar':`${info.icon} Generar`;
}

// ─── UPLOAD
// ─── UPLOAD ───────────────────────────────────────────────────────────────────
function handleFileInput(e){
  const file = e.target.files[0]; if(!file) return;
  readFile(file);
}
function handleDrop(e){
  e.preventDefault();document.getElementById('upload-zone').classList.remove('drag');
  const file=e.dataTransfer.files[0];if(file)void readFile(file);
}
async function readFile(file){
  try{
    const allowed=new Set(['image/jpeg','image/png','image/webp']);
    if(!file||!allowed.has(file.type))throw new Error('Solo se permiten JPG, PNG o WEBP.');
    if(!/\.(?:jpe?g|png|webp)$/i.test(file.name||''))throw new Error('La extensión del archivo no coincide con un formato permitido.');
    if(file.size<=0||file.size>8*1024*1024)throw new Error('La imagen debe pesar máximo 8 MB.');
    const head=new Uint8Array(await file.slice(0,16).arrayBuffer());
    const jpeg=head[0]===0xff&&head[1]===0xd8&&head[2]===0xff;
    const png=head[0]===0x89&&head[1]===0x50&&head[2]===0x4e&&head[3]===0x47;
    const webp=head.length>=12&&String.fromCharCode(...head.slice(0,4))==='RIFF'&&String.fromCharCode(...head.slice(8,12))==='WEBP';
    if(!(jpeg||png||webp))throw new Error('La firma real del archivo no es una imagen permitida.');
    const bitmap=typeof createImageBitmap==='function'?await createImageBitmap(file):null;
    if(bitmap){
      if(bitmap.width>8192||bitmap.height>8192||bitmap.width*bitmap.height>32_000_000){bitmap.close();throw new Error('La imagen supera el límite de dimensiones.');}
      bitmap.close();
    }
    const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('No se pudo leer la imagen'));r.readAsDataURL(file);});
    uploadedImageUrl=String(data);uploadedIsUrl=false;
    document.getElementById('upload-zone').style.display='none';
    document.getElementById('upload-preview').style.display='block';
    document.getElementById('upload-img').src=uploadedImageUrl;updateGenBtn();
  }catch(err){setResultError(err.message);clearUpload();}
}
function clearUpload(){
  uploadedImageUrl = null;
  uploadedIsUrl = false;
  document.getElementById('upload-zone').style.display = 'block';
  document.getElementById('upload-preview').style.display = 'none';
  document.getElementById('file-input').value = '';
  const urlInput = document.getElementById('url-input');
  if(urlInput) urlInput.value = '';
  updateGenBtn();
}

// ─── GENERATE ────────────────────────────────────────────────────────────────
async function generate(){
  if(generating){cancelGeneration();return;}
  if(!hostReady){setResultError('Abre OpenGen desde el dashboard para usar el backend seguro.');return;}
  if(!document.getElementById('rights-confirm')?.checked){setResultError('Confirma los derechos y permisos del material antes de generar.');return;}
  const section=currentSection,info={...SECTIONS[section]},prompt=document.getElementById('prompt-ta').value.trim();
  const models=MODELS[section]||[],modelId=selectedModel[section]||models[0]?.id,model=models.find(m=>m.id===modelId)||models[0];
  if(!model)return;
  const snap={section,info,prompt,model,modelId,image:uploadedImageUrl,isUrl:uploadedIsUrl,
    imgRatio:currentImgRatio,vidRatio:currentVidRatio,duration:currentDuration,resolution:currentResolution};
  if((info.isVid||info.isAudio)&&!confirm('Esta generación de '+(info.isVid?'video':'audio')+' puede consumir más cuota. ¿Continuar?'))return;
  const controller=new AbortController();currentJobController=controller;generating=true;updateGenBtn();
  const started=Date.now(),jobId='vai_'+(crypto.randomUUID?crypto.randomUUID().replace(/[^A-Za-z0-9_-]/g,''):Date.now().toString(36)+Math.random().toString(36).slice(2));
  postHost('job-start',{jobId,section,model:model.name});setResultLoading();setProgress(10);
  const IMAGE_FIELDS = {
    'flux-kontext-dev-i2i':'images_list','flux-kontext-pro-i2i':'images_list','flux-kontext-max-i2i':'images_list',
    'gpt4o-image-to-image':'images_list','nano-banana-edit':'images_list','nano-banana-pro-edit':'images_list',
    'nano-banana-2-edit':'images_list','bytedance-seedream-edit-v4':'images_list','qwen-image-edit-plus':'images_list',
    'qwen-image-edit-plus-lora':'images_list','qwen-image-edit-2511':'images_list','wan2.5-image-edit':'images_list',
    'wan2.6-image-edit':'images_list','kling-o1-edit-image':'images_list','flux-2-dev-edit':'images_list',
    'flux-2-flex-edit':'images_list','flux-2-pro-edit':'images_list','flux-2-klein-4b-edit':'images_list',
    'flux-2-klein-9b-edit':'images_list','vidu-q2-reference-to-image':'images_list','bytedance-seedream-v4.5-edit':'images_list',
    'gpt-image-2-edit':'images_list','gpt-image-1.5-edit':'images_list','seedream-5.0-edit':'images_list',
    'veo3-image-to-video':'images_list','veo3-fast-image-to-video':'images_list','pixverse-v4.5-i2v':'images_list',
    'vidu-v2.0-i2v':'images_list','vidu-q1-reference':'images_list','pixverse-v5-i2v':'images_list',
    'seedance-lite-reference-video':'images_list','wan2.1-reference-video':'images_list',
    'openai-sora-2-image-to-video':'images_list','openai-sora-2-pro-image-to-video':'images_list',
    'veo3.1-reference-to-video':'images_list','vidu-q2-reference':'images_list',
    'grok-imagine-image-to-video':'images_list','kling-o1-reference-to-video':'images_list',
    'pixverse-v5.5-i2v':'images_list','kling-o1-standard-reference-to-video':'images_list',
    'seedance-v2.0-i2v':'images_list',
    'ai-dress-change':'model_image_url','ai-product-photography':'person_image_url',
  };
  const body={};if(prompt)body.prompt=prompt;
  try{
    if(snap.image&&info.needImg){
      let imageUrl=snap.image;
      if(imageUrl.startsWith('data:')&&!snap.isUrl){setLoadingText('Subiendo imagen de forma segura…');imageUrl=await uploadImageForAPI(imageUrl,controller.signal);}
      else{imageUrl=allowedInputUrl(imageUrl);if(!imageUrl)throw new Error('La URL de entrada no cumple la política HTTPS de imágenes.');}
      const imgField=IMAGE_FIELDS[modelId]||'image_url';
      if(imgField==='images_list')body.images_list=[imageUrl];else body[imgField]=imageUrl;
    }
    if(info.isVid){body.aspect_ratio=snap.vidRatio;body.duration=snap.duration;body.resolution=snap.resolution;}
    else if(!info.isAudio&&!info.noPrompt)body.aspect_ratio=snap.imgRatio;

    const created=await hostRpc('generate',{endpoint:model.ep,payload:body,jobId},controller.signal);
    const reqId=created.request_id;if(!reqId)throw new Error('El backend no devolvió request_id.');
    const cap=document.getElementById('cost-status');
    if(cap&&created.quota)cap.textContent=`Cuota diaria: ${created.quota.used||0}/${created.quota.limit||'—'} generaciones`;
    setProgress(30);postHost('job-progress',{jobId,progress:30});
    let attempt=0,delay=1800,done=false;
    while(Date.now()-started<4*60*1000){
      await sleep(delay,controller.signal);attempt++;delay=Math.min(8000,Math.round(delay*1.35));
      const pct=Math.min(94,30+attempt*2);setProgress(pct);postHost('job-progress',{jobId,progress:pct});
      let pd;
      try{pd=await hostRpc('poll',{requestId:reqId},controller.signal);}
      catch(err){if((err.transient||err.status===502)&&attempt<5)continue;throw err;}
      if(['completed','succeeded'].includes(pd.status)){
        const url=safeHttpsUrl(pd.url,{result:true});if(!url)throw new Error('El proveedor no entregó una URL de resultado permitida.');
        const type=info.isAudio?'audio':(info.isVid||section==='vfx')?'video':'image';
        const item={url,type,model:model.name,sec:section,prompt,time:Date.now(),jobId,
          durationMs:Date.now()-started,costUsd:Number.isFinite(Number(pd.cost_usd))?Number(pd.cost_usd):null};
        setProgress(100);setResultMedia(item);addToHistory(item);postHost('job-complete',{jobId,asset:item});done=true;break;
      }
      if(['failed','error'].includes(pd.status))throw new Error(pd.error||'La generación falló en el proveedor.');
    }
    if(!done)throw new Error('Tiempo de espera agotado (4 min).');
  }catch(err){
    const cancelled=err?.name==='AbortError';
    setResultError(cancelled?'Generación cancelada.':err.message);
    postHost('job-error',{jobId,error:cancelled?'cancelled':String(err.message||err)});
  }finally{
    generating=false;if(currentJobController===controller)currentJobController=null;updateGenBtn();
    setTimeout(()=>{const p=document.getElementById('progress-bar-wrap');if(p)p.style.display='none';},1200);
  }
}
function cancelGeneration(){currentJobController?.abort();}

function sleep(ms,signal){
  return new Promise((resolve,reject)=>{
    const t=setTimeout(resolve,ms);
    if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);const e=new Error('Generación cancelada');e.name='AbortError';reject(e);},{once:true});
  });
}

// ─── RESULT
// ─── RESULT ───────────────────────────────────────────────────────────────────
function setProgress(pct){
  progress=pct;
  const wrap = document.getElementById('progress-bar-wrap');
  const bar = document.getElementById('progress-bar');
  wrap.style.display = 'block';
  bar.style.width = pct+'%';
  bar.style.background = `linear-gradient(90deg, ${SECTIONS[currentSection].color}, #6366f1)`;
  // also update loading bar
  const lb = document.getElementById('loading-bar');
  if(lb){ lb.style.width=pct+'%'; lb.style.background=`linear-gradient(90deg, ${SECTIONS[currentSection].color}, #6366f1)`; }
  const lp = document.getElementById('loading-pct');
  if(lp) lp.textContent = Math.round(pct)+'%'+((['i2v','t2v'].includes(currentSection))?' · Videos toman 1-3 min':'');
}

function setResultEmpty(){
  const info = SECTIONS[currentSection];
  document.getElementById('progress-bar-wrap').style.display='none';
  document.getElementById('result-content').innerHTML = `
    <div class="result-empty" id="empty-state">
      <div class="result-empty-icon">${info.icon}</div>
      <div class="result-empty-text">El resultado aparecerá aquí</div>
    </div>`;
}

function setLoadingText(txt){
  const el = document.querySelector('.loading-wrap div[style*="color:var(--tx2"]');
  if(el) el.textContent = txt;
  // Also update the processing text
  const all = document.querySelectorAll('.loading-wrap div');
  all.forEach(d => { if(d.textContent.includes('Procesando')) d.textContent = txt; });
}
function setResultLoading(){
  const info = SECTIONS[currentSection];
  document.getElementById('result-content').innerHTML = `
    <div class="loading-wrap">
      <div class="spinner" style="border-top-color:${info.color}"></div>
      <div style="color:var(--tx2);font-size:13px">Procesando...</div>
      <div class="loading-bar-wrap"><div id="loading-bar" class="loading-bar" style="width:10%"></div></div>
      <div id="loading-pct" class="loading-pct">10%</div>
    </div>`;
}

function setResultError(msg){
  const root=document.getElementById('result-content');root.replaceChildren();
  const box=document.createElement('div');box.className='result-error';
  const icon=document.createElement('div');icon.style.fontSize='36px';icon.textContent='⚠';
  const title=document.createElement('div');title.style.cssText='color:var(--r);font-weight:600';title.textContent='Error al generar';
  const detail=document.createElement('div');detail.style.cssText='color:var(--tx3);font-size:12px;max-width:320px;white-space:pre-wrap';detail.textContent=String(msg||'Error desconocido').slice(0,800);
  box.append(icon,title,detail);root.appendChild(box);
}
function setResultMedia(item){
  const url=safeHttpsUrl(item?.url,{result:true});if(!url){setResultError('URL de resultado no permitida.');return;}
  const root=document.getElementById('result-content');root.replaceChildren();
  const wrap=document.createElement('div');wrap.className='result-media';
  let media;
  if(item.type==='video'){media=document.createElement('video');media.controls=true;media.autoplay=true;media.loop=true;}
  else if(item.type==='audio'){
    const aw=document.createElement('div');aw.className='result-audio-wrap';
    const note=document.createElement('div');note.style.fontSize='30px';note.textContent='♪';
    media=document.createElement('audio');media.controls=true;media.style.cssText='flex:1;height:38px';aw.append(note,media);wrap.appendChild(aw);
  }else{media=document.createElement('img');media.alt='Resultado generado';}
  media.src=url;if(item.type!=='audio')media.style.cssText='width:100%;max-height:460px;object-fit:contain;border-radius:12px;background:#000';
  if(item.type!=='audio')wrap.appendChild(media);
  const dl=document.createElement('a');dl.href=url;dl.target='_blank';dl.rel='noopener noreferrer';dl.download='';dl.className='result-dl';
  dl.textContent='↓ Descargar '+(item.type==='video'?'video':item.type==='audio'?'audio':'imagen');wrap.appendChild(dl);
  if(window.parent!==window){
    const use=document.createElement('button');use.type='button';use.className='result-dl';use.style.marginLeft='8px';use.textContent='↗ Vincular al dashboard';
    use.addEventListener('click',()=>postHost('asset-selected',{asset:{url,type:item.type,model:item.model,jobId:item.jobId||''}}));wrap.appendChild(use);
  }
  const meta=document.createElement('div');meta.style.cssText='font-size:10px;color:var(--tx3);margin-top:7px';
  meta.textContent='Generado en '+Math.max(1,Math.round((item.durationMs||0)/1000))+' s'+(item.costUsd!=null?' · costo proveedor US$ '+item.costUsd.toFixed(3):' · costo real no reportado por proveedor');
  wrap.appendChild(meta);root.appendChild(wrap);
}

// ─── HISTORY
// ─── HISTORY ─────────────────────────────────────────────────────────────────
function addToHistory(item){
  history.unshift(item);
  document.getElementById('hist-count').textContent = history.length;
  document.getElementById('hist-count2').textContent = history.length;
  renderHistory();
}

function renderHistory(){
  const list=document.getElementById('hist-list');list.replaceChildren();
  if(!history.length){const e=document.createElement('div');e.className='hist-empty';e.textContent='Sin historial en esta sesión';list.appendChild(e);return;}
  history.forEach((item,i)=>{
    const row=document.createElement('div');row.className='hist-item'+(historySelectedIdx===i?' selected':'');row.addEventListener('click',()=>selectHistory(i));
    if(item.type==='image'){const img=document.createElement('img');const url=safeHttpsUrl(item.url,{result:true});if(url)img.src=url;img.alt='';row.appendChild(img);}
    else{const p=document.createElement('div');p.className='hist-item-placeholder';p.textContent=item.type==='audio'?'♪':'▶';row.appendChild(p);}
    const label=document.createElement('div');label.className='hist-item-label';label.textContent=String(item.model||'Resultado').slice(0,120);row.appendChild(label);list.appendChild(row);
  });
}
function selectHistory(i){
  historySelectedIdx = i;
  setResultMedia(history[i]);
  renderHistory();
}

function toggleHistory(){
  showingHistory = !showingHistory;
  document.getElementById('hist-panel').style.display = showingHistory ? 'flex' : 'none';
  document.getElementById('hist-panel').style.flexDirection = 'column';
  const btn = document.getElementById('hist-toggle-btn');
  btn.classList.toggle('hist-on', showingHistory);
}
